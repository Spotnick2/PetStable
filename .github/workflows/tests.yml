name: Tests
on: [push, pull_request]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      # The embedded library at the .pkgmeta pin (r12): test_addon and test_methods load its
      # runtime files as the client does. The test scaffolding is WowTestKit's, never LibGlass's.
      - uses: actions/checkout@v4
        with:
          repository: Spotnick2/LibGlass
          ref: 34a2dd5f648861a212c588d6f87e3845f3a4169f
          path: .test-output/LibGlass
      - name: Lua syntax
        run: |
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file" || exit 1
          done < <(find Util.lua Core.lua Catalog.lua CatalogData.lua CatalogReference.lua CatalogTeachers.lua CatalogFamilies.lua CatalogSpells.lua Sightings.lua PetState.lua GuideData.lua GuideModels.lua GuideAppearances.lua GuideUI.lua UpgradesData.lua UpgradesUI.lua PetsUI.lua Toast.lua TargetButton.lua TeacherAlert.lua UI.lua Tools tests -name '*.lua' -print0)
      # The test scaffolding at the commit tests/kit.pin names, checked to BE that commit
      # (tests/kit.lua reads it from $WOWTESTKIT).
      - name: Fetch WowTestKit at its pin
        run: |
          bash tests/fetch_kit.sh "$RUNNER_TEMP/WowTestKit"
          echo "WOWTESTKIT=$RUNNER_TEMP/WowTestKit" >> "$GITHUB_ENV"
      # Every tests/test_*.lua, one process each (the kit's runner).
      - name: Lua unit tests
        env:
          PETSTABLE_LIBGLASS: .test-output/LibGlass
          FOREVERPROBE_OPTIONAL: '1'   # ForeverProbe is private and local: the probe tests run locally
        run: bash "$WOWTESTKIT/scripts/run.sh"
      - name: Importer tests
        run: |
          python3 -m unittest discover -s tests -p "test_import_reference.py"
          python3 -m unittest discover -s tests -p "test_import_teachers.py"
          python3 -m unittest discover -s tests -p "test_import_families.py"
          python3 -m unittest discover -s tests -p "test_import_spells.py"
